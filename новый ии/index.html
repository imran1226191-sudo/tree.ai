<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRee.AI v19 — Multilingual Omni-AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf6', 100: '#dcfce9', 200: '#bbf7d4', 300: '#86efb3', 400: '#4ade8c', 500: '#22c56e', 600: '#16a35a', 700: '#15803f', 800: '#166534', 900: '#14532b' },
            ink: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#0a0f1a' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.25s ease-out forwards' },
          keyframes: {
            fadeIn: { '0%': { opacity: 0, transform: 'translateY(6px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    .voice-wave { display: flex; align-items: center; gap: 3px; height: 30px; }
    .voice-bar { width: 4px; background: #16a35a; border-radius: 2px; animation: wave 1s ease-in-out infinite; }
    .voice-bar:nth-child(1) { animation-delay: 0s; height: 20%; }
    .voice-bar:nth-child(2) { animation-delay: 0.1s; height: 40%; }
    .voice-bar:nth-child(3) { animation-delay: 0.2s; height: 60%; }
    .voice-bar:nth-child(4) { animation-delay: 0.3s; height: 40%; }
    .voice-bar:nth-child(5) { animation-delay: 0.4s; height: 20%; }
    @keyframes wave { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.5); } }

    .markdown-body { line-height: 1.65; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 0.9em; margin-bottom: 0.4em; }
    .markdown-body ul, .markdown-body ol { margin: 0.4em 0; padding-left: 1.4em; }
    .markdown-body code:not(pre code) { background: rgba(34,197,110,0.12); padding: 0.15em 0.4em; border-radius: 0.3em; font-size: 0.88em; }
    .markdown-body pre { position: relative; border-radius: 0.6rem; overflow: hidden; margin: 0.8em 0; background: #0f172a; padding: 1em; }
    .markdown-body blockquote { border-left: 3px solid #16a35a; padding-left: 0.8em; margin: 0.5em 0; color: #64748b; }

    .img-container { position: relative; border-radius: 0.85rem; overflow: hidden; max-width: 512px; }
    .img-container img { width: 100%; display: block; }

    .toast { position: fixed; top: 18px; right: 18px; z-index: 100; animation: slideIn 0.25s ease-out; }
    @keyframes slideIn { from { transform: translateX(380px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .screenshot-loading { position: fixed; inset: 0; background: rgba(10,15,26,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px); }
    .surface { background: #0f172a; border: 1px solid #1e293b; }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(34,197,110,0.25); border-top-color: #16a35a; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-ink-950 text-ink-100 h-screen overflow-hidden flex flex-col">

  <div id="toast-container"></div>

  <div id="voice-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="surface rounded-2xl p-8 max-w-md w-full mx-4 text-center shadow-2xl">
      <div class="voice-wave justify-center mb-4 h-16">
        <div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div>
      </div>
      <h3 class="text-lg font-semibold mb-1">Слушаю...</h3>
      <p class="text-ink-500 text-sm mb-4">Говорите, я слушаю</p>
      <button onclick="stopVoiceInput()" class="px-5 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-medium transition">Остановить</button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <aside id="sidebar" class="w-60 bg-ink-950 border-r border-ink-800 flex flex-col">
      <div class="px-3 pt-4 pb-2">
        <div class="flex items-center gap-2 px-1 mb-5">
          <svg viewBox="0 0 64 64" class="w-7 h-7 flex-shrink-0">
            <circle cx="32" cy="32" r="30" fill="none" stroke="url(#g1)" stroke-width="3"/>
            <path d="M32 46 V30 M32 30 L24 22 M32 30 L40 22 M24 22 L18 26 M24 22 L22 16 M40 22 L46 26 M40 22 L42 16 M32 22 L32 14" stroke="url(#g1)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="g1" x1="0" y1="0" x2="64" y2="64"><stop offset="0" stop-color="#22c56e"/><stop offset="1" stop-color="#15803f"/></linearGradient></defs>
          </svg>
          <span class="text-ink-100 font-semibold text-sm">TRee.AI</span>
        </div>
        <button onclick="createNewChat()" class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm text-ink-200 hover:bg-ink-800/70 transition mb-0.5">
          <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Новый чат
        </button>
        <button onclick="toggleImagineMode()" id="imagine-toggle-btn" class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm text-ink-200 hover:bg-ink-800/70 transition">
          <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 7h10v10H7V7z"/></svg>
          <span id="imagine-toggle-label">Imagine (Картинки)</span>
        </button>
        <input type="text" id="chat-search" placeholder="Поиск чатов..." oninput="renderSidebar()"
          class="w-full mt-2 px-2.5 py-1.5 text-xs rounded-lg bg-ink-900 border border-ink-800 focus:ring-1 focus:ring-brand-600 outline-none placeholder:text-ink-500 text-ink-200">
      </div>
      <div class="px-3 pt-3 pb-1">
        <p class="text-[11px] font-medium text-ink-500 px-1 uppercase tracking-wide">История</p>
      </div>
      <div id="chat-list" class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5 scrollbar-thin"></div>
      <div class="p-3 border-t border-ink-800">
        <div class="flex items-center justify-between gap-2 px-1">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-7 h-7 rounded-full bg-brand-700 flex items-center justify-center text-white text-xs font-semibold flex-shrink-0">T</div>
            <div class="min-w-0">
              <div class="text-sm text-ink-100 truncate">TRee.AI</div>
              <div class="text-xs text-ink-500">Multi-Language Pro</div>
            </div>
          </div>
          <button onclick="clearAllChats()" title="Очистить всю историю" class="p-1.5 rounded-lg text-ink-500 hover:text-red-400 hover:bg-ink-800 transition flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col bg-ink-950">
      <header class="h-14 flex items-center justify-between px-5 border-b border-ink-800/40">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 hover:bg-ink-800 rounded-lg text-ink-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="text-xs text-ink-500 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 bg-brand-500 rounded-full"></span>v19.0 Multi-Lang Omni
        </span>

        <div class="flex items-center gap-1">
          <button onclick="toggleVoiceInput()" id="voice-btn" class="p-2 rounded-lg hover:bg-ink-800 transition relative" title="Голосовой ввод">
            <svg class="w-[18px] h-[18px] text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
            <span id="voice-indicator" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden animate-ping"></span>
          </button>
          <button onclick="captureScreenshot()" class="p-2 rounded-lg hover:bg-ink-800 transition" title="Сделать скриншот">
            <svg class="w-[18px] h-[18px] text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
        </div>
      </header>

      <div id="messages-container" class="flex-1 overflow-y-auto p-6 scrollbar-thin">
        <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center space-y-6">
          <svg viewBox="0 0 64 64" class="w-16 h-16">
            <circle cx="32" cy="32" r="30" fill="none" stroke="url(#g3)" stroke-width="2.5"/>
            <path d="M32 46 V30 M32 30 L24 22 M32 30 L40 22 M24 22 L18 26 M24 22 L22 16 M40 22 L46 26 M40 22 L42 16 M32 22 L32 14" stroke="url(#g3)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="g3" x1="0" y1="0" x2="64" y2="64"><stop offset="0" stop-color="#22c56e"/><stop offset="1" stop-color="#15803f"/></linearGradient></defs>
          </svg>
          <div>
            <h2 class="text-3xl font-semibold mb-2 text-ink-100">TRee.AI</h2>
            <p class="text-ink-500 max-w-md mx-auto text-sm">Универсальный помощник. Задавайте любые вопросы на русском, узбекском или английском языках!</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl mt-2">
            <button onclick="sendSuggestion('O\'zbekiston haqida qisqacha ma\'lumot ber')" class="p-4 rounded-xl bg-ink-900 border border-ink-800 hover:border-brand-600 transition text-left group">
              <p class="font-medium text-sm text-brand-400">🇺🇿 O'zbekiston haqida</p>
              <p class="text-xs text-ink-500 mt-1">ma'lumot olish</p>
            </button>
            <button onclick="sendSuggestion('Объясни квантовые вычисления простыми словами')" class="p-4 rounded-xl bg-ink-900 border border-ink-800 hover:border-brand-600 transition text-left group">
              <p class="font-medium text-sm text-brand-400">📚 Квантовые вычисления</p>
              <p class="text-xs text-ink-500 mt-1">простым языком</p>
            </button>
            <button onclick="sendSuggestion('Write a Python script for a simple calculator')" class="p-4 rounded-xl bg-ink-900 border border-ink-800 hover:border-brand-600 transition text-left group">
              <p class="font-medium text-sm text-brand-400">💻 Python Calculator</p>
              <p class="text-xs text-ink-500 mt-1">English prompt</p>
            </button>
            <button onclick="sendSuggestion('Создай изображение дракона в стиле фэнтези')" class="p-4 rounded-xl bg-ink-900 border border-ink-800 hover:border-brand-600 transition text-left group">
              <p class="font-medium text-sm text-brand-400">🐉 Дракон</p>
              <p class="text-xs text-ink-500 mt-1">в стиле фэнтези</p>
            </button>
          </div>
        </div>
        <div id="messages-list" class="hidden max-w-3xl mx-auto space-y-5"></div>
      </div>

      <div class="px-4 pb-4">
        <form id="chat-form" onsubmit="handleSubmit(event)" class="max-w-3xl mx-auto">
          <div id="attached-image-preview" class="hidden mb-2 relative inline-block">
            <img id="attached-image-thumb" class="h-20 rounded-lg border border-ink-700 object-cover" alt="Прикреплённое фото">
            <button type="button" onclick="removeAttachedImage()" class="absolute -top-2 -right-2 w-5 h-5 bg-ink-700 hover:bg-red-600 text-white rounded-full flex items-center justify-center text-xs transition">✕</button>
          </div>
          <div class="flex items-end gap-2 bg-ink-900 border border-ink-800 rounded-2xl p-1.5">
            <input type="file" id="image-attach-input" accept="image/*" class="hidden" onchange="handleImageAttach(event)">
            <button type="button" onclick="document.getElementById('image-attach-input').click()" class="p-2.5 rounded-xl hover:bg-ink-800 transition" title="Прикрепить изображение">
              <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 10-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
            </button>
            <textarea id="user-input" rows="1" placeholder="Задайте вопрос на русском, узбекском или английском..."
              class="flex-1 bg-transparent outline-none resize-none px-2 py-2.5 max-h-32 text-sm placeholder:text-ink-500 text-ink-100"
              oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
            <button type="button" onclick="toggleVoiceInput()" class="p-2.5 rounded-xl hover:bg-ink-800 transition" title="Голосовой ввод">
              <svg class="w-4 h-4 text-ink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
            </button>
            <button type="submit" id="send-btn" class="p-2.5 bg-brand-600 hover:bg-brand-500 text-ink-950 rounded-xl transition disabled:opacity-30 disabled:cursor-not-allowed flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-7 7m7-7l7 7"/></svg>
            </button>
          </div>
          <p class="text-center text-[11px] text-ink-600 mt-2">TRee.AI поддерживает многоязычный интеллектуальный движок.</p>
        </form>
      </div>
    </main>
  </div>

  <script>
    const state = {
      chats: [], 
      currentChatId: null, 
      isListeningTeacher: false,
      speechRecognition: null, 
      imagineMode: false, 
      attachedImage: null
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-brand-600' : type === 'error' ? 'bg-red-500' : 'bg-ink-700';
      toast.className = `toast ${bgColor} text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm`;
      toast.innerHTML = `<span class="font-medium">${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3000);
    }

    function toggleImagineMode() {
      state.imagineMode = !state.imagineMode;
      const btn = document.getElementById('imagine-toggle-btn');
      const label = document.getElementById('imagine-toggle-label');
      if (state.imagineMode) {
        btn.classList.add('bg-brand-600/20', 'border', 'border-brand-600');
        label.innerText = 'Imagine: ВКЛ';
        showToast('Режим генерации картинок включён');
      } else {
        btn.classList.remove('bg-brand-600/20', 'border', 'border-brand-600');
        label.innerText = 'Imagine (Картинки)';
        showToast('Режим чата');
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSubmit(e);
      }
    }

    function handleImageAttach(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        state.attachedImage = uploadEvent.target.result;
        const thumb = document.getElementById('attached-image-thumb');
        thumb.src = state.attachedImage;
        document.getElementById('attached-image-preview').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
      state.attachedImage = null;
      document.getElementById('attached-image-preview').classList.add('hidden');
      document.getElementById('image-attach-input').value = '';
    }

    async function captureScreenshot() {
      const messagesList = document.getElementById('messages-list');
      if (messagesList.classList.contains('hidden') || messagesList.children.length === 0) {
        showToast('Нет сообщений для скриншота', 'error');
        return;
      }
      const loading = document.createElement('div');
      loading.className = 'screenshot-loading';
      loading.innerHTML = `<div class="surface rounded-2xl p-6 flex items-center gap-4"><div class="spinner"></div><span class="text-sm font-medium">Создаю скриншот...</span></div>`;
      document.body.appendChild(loading);
      try {
        await new Promise(resolve => setTimeout(resolve, 300));
        const canvas = await html2canvas(messagesList, { backgroundColor: '#0a0f1a', scale: 2, useCORS: true });
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = `tree-ai-chat.png`;
          link.href = url; link.click();
          URL.revokeObjectURL(url);
          showToast('Скриншот сохранён');
        }, 'image/png');
      } catch (error) {
        showToast('Не удалось создать скриншот', 'error');
      } finally {
        loading.remove();
      }
    }

    function initTeacherListening() {
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        showToast('Браузер не поддерживает распознавание речи', 'error');
        return false;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      state.speechRecognition = new SpeechRecognition();
      state.speechRecognition.continuous = true;
      state.speechRecognition.interimResults = true;
      state.speechRecognition.lang = 'ru-RU';

      state.speechRecognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const finalTranscript = event.results[i][0].transcript.trim();
            if (finalTranscript.length > 3) {
              document.getElementById('user-input').value = finalTranscript;
              handleSubmit(new Event('submit'));
            }
          } else {
            document.getElementById('user-input').value = event.results[i][0].transcript;
          }
        }
      };

      state.speechRecognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
          showToast('Ошибка микрофона: ' + event.error, 'error');
        }
      };

      state.speechRecognition.onend = () => {
        if (state.isListeningTeacher) {
          try { state.speechRecognition.start(); } catch (e) {}
        }
      };

      return true;
    }

    function toggleVoiceInput() {
      if (!state.speechRecognition) {
        const ok = initTeacherListening();
        if (!ok) return;
      }

      state.isListeningTeacher = !state.isListeningTeacher;
      const overlay = document.getElementById('voice-overlay');
      const indicator = document.getElementById('voice-indicator');

      if (state.isListeningTeacher) {
        try { state.speechRecognition.start(); } catch (e) {}
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        if (indicator) indicator.classList.remove('hidden');
        showToast('Режим слуха запущен');
      } else {
        stopVoiceInput();
      }
    }

    function stopVoiceInput() {
      state.isListeningTeacher = false;
      if (state.speechRecognition) {
        try { state.speechRecognition.stop(); } catch (e) {}
      }
      const overlay = document.getElementById('voice-overlay');
      const indicator = document.getElementById('voice-indicator');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      if (indicator) indicator.classList.add('hidden');
    }

    function createNewChat() {
      const id = 'chat_' + Date.now();
      state.chats.unshift({ id, title: 'Новый чат', messages: [] });
      state.currentChatId = id;
      renderSidebar(); renderMessages();
    }

    function switchChat(id) {
      state.currentChatId = id;
      renderSidebar(); renderMessages();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      state.chats = state.chats.filter(c => c.id !== id);
      if (state.currentChatId === id) state.currentChatId = state.chats.length > 0 ? state.chats[0].id : null;
      renderSidebar(); renderMessages();
    }

    function clearAllChats() {
      state.chats = [];
      state.currentChatId = null;
      createNewChat();
    }

    function renderSidebar() {
      const container = document.getElementById('chat-list');
      const searchTerm = document.getElementById('chat-search')?.value.toLowerCase() || '';
      container.innerHTML = '';
      state.chats.filter(c => c.title.toLowerCase().includes(searchTerm)).forEach(chat => {
        const el = document.createElement('div');
        el.className = `px-2.5 py-2 rounded-lg cursor-pointer transition group flex justify-between items-center ${chat.id === state.currentChatId ? 'bg-ink-800 text-ink-100' : 'text-ink-300 hover:bg-ink-800/60'}`;
        el.onclick = () => switchChat(chat.id);
        el.innerHTML = `<span class="text-sm truncate flex-1">${chat.title}</span><button onclick="deleteChat('${chat.id}', event)" class="ml-2 text-ink-500 hover:text-red-400 opacity-0 group-hover:opacity-100">✕</button>`;
        container.appendChild(el);
      });
    }

    function renderMessages() {
      const welcome = document.getElementById('welcome-screen');
      const list = document.getElementById('messages-list');
      const chat = state.chats.find(c => c.id === state.currentChatId);
      if (!chat || chat.messages.length === 0) {
        welcome.classList.remove('hidden'); list.classList.add('hidden');
        return;
      }
      welcome.classList.add('hidden'); list.classList.remove('hidden'); list.innerHTML = '';

      chat.messages.forEach((msg) => {
        const el = document.createElement('div');
        el.className = `flex gap-3 ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;

        if (msg.role === 'user') {
          const thumb = msg.attachedImage ? `<img src="${msg.attachedImage}" class="w-full max-w-[160px] rounded-lg mb-2">` : '';
          el.innerHTML = `<div class="bg-brand-700 text-white px-4 py-2.5 rounded-2xl rounded-br-md max-w-[80%] text-sm">${thumb}${escapeHtml(msg.content)}</div>`;
        } else if (msg.type === 'image') {
          el.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-brand-700/30 flex items-center justify-center text-brand-400 flex-shrink-0 font-bold">T</div>
            <div class="max-w-[80%]">
              <div class="img-container border border-ink-800">
                <img src="${msg.url}" alt="Сгенерированное изображение">
              </div>
            </div>`;
        } else {
          el.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-brand-700/30 flex items-center justify-center text-brand-400 flex-shrink-0 font-bold">T</div>
            <div class="bg-ink-900 border border-ink-800 text-ink-100 px-4 py-3 rounded-2xl rounded-bl-md max-w-[85%] text-sm markdown-body">
              ${msg.loading ? '<div class="spinner"></div>' : marked.parse(msg.content)}
            </div>`;
        }
        list.appendChild(el);
      });
      document.getElementById('messages-container').scrollTop = document.getElementById('messages-container').scrollHeight;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function sendSuggestion(text) {
      document.getElementById('user-input').value = text;
      handleSubmit(new Event('submit'));
    }

    async function handleSubmit(e) {
      if (e && e.preventDefault) e.preventDefault();
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();
      if (!text && !state.attachedImage) return;

      if (!state.currentChatId || state.chats.length === 0) createNewChat();
      const chat = state.chats.find(c => c.id === state.currentChatId);
      if (chat.title === 'Новый чат') chat.title = text.slice(0, 30);

      const userMsg = { role: 'user', content: text, attachedImage: state.attachedImage };
      chat.messages.push(userMsg);
      inputEl.value = '';
      inputEl.style.height = 'auto';
      state.attachedImage = null;
      document.getElementById('attached-image-preview').classList.add('hidden');

      const assistantMsgIndex = chat.messages.length;
      chat.messages.push({ role: 'assistant', content: '', loading: true });

      renderSidebar();
      renderMessages();

      if (state.imagineMode || text.toLowerCase().includes('нарисуй')) {
        chat.messages[assistantMsgIndex] = {
          role: 'assistant',
          type: 'image',
          url: `https://pollinations.ai/p/${encodeURIComponent(text)}?width=800&height=600&seed=${Math.floor(Math.random()*1000)}`
        };
        renderMessages();
        return;
      }

      let aiAnswer = "";
      const lower = text.toLowerCase();

      // Умное распознавание предложенных фраз даже с опечатками
      if (lower.includes('привет') || lower.includes('прив') || lower.includes('салом') || lower.includes('здравст')) {
        aiAnswer = "Привет! Я готов помоч на уроке. Задавай любой вопрос!";
      } else if (lower.includes('как дела') || lower.includes('как делла') || lower.includes('как ты') || lower.includes('какие дела')) {
        aiAnswer = "Отлично! Работаю на полную мощность и готов отвечать на любые вопросы.";
      } else if (lower.includes('код') || lower.includes('программа') || lower.includes('скрипт') || lower.includes('питон') || lower.includes('python')) {
        aiAnswer = "Вот простой код на Python:\n\n```python\ndef hello_world():\n    print('Привет от TRee.AI!')\n\nhello_world()\n```";
      } else if (lower.includes('зовут') || lower.includes('имя') || lower.includes('кто ты')) {
        aiAnswer = "Меня зовут **TRee.AI** — я твой виртуальный голосовой и текстовый помощник.";
      } else if (lower.includes('площадь') && (lower.includes('росси') || lower.includes('рф'))) {
        aiAnswer = "Площадь России составляет около **17 098 246 км²** (крупнейшая страна в мире).";
      } else if (lower.includes('площадь') && (lower.includes('узбек') || lower.includes('узб'))) {
        aiAnswer = "Площадь Узбекистана составляет **448 978 км²**.";
      } else if (lower.includes('столиц') || lower.includes('сталиц') || lower.includes('главный город')) {
        aiAnswer = "Столица Узбекистана — город **Ташкент**.";
      } else {
        // Если фраз нет в списке — запрашиваем у серверного ИИ
        try {
          const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
          if (response.ok) {
            aiAnswer = await response.text();
          }
        } catch (err) {}

        if (!aiAnswer || aiAnswer.length < 2) {
          aiAnswer = "К сожалению, не удалось получить быстрый ответ от сервера. Проверь подключение к интернету.";
        }
      }

      chat.messages[assistantMsgIndex] = { role: 'assistant', content: aiAnswer, loading: false };
      renderMessages();
    }

    window.onload = () => { createNewChat(); };
  </script>
</body>
</html>
